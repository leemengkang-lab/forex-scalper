[project]
name = "forex-scalper"
version = "0.1.0"
description = "Multi-timeframe / multi-pair scalping bot (OANDA v20)"
requires-python = ">=3.13"
dependencies = [
    "oandapyV20>=0.7.2",
    "requests>=2.31",
    "six>=1.16",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-telegram-bot[ext]>=21.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_scalper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "demo: tests that hit the real OANDA demo account (require credentials)",
]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored scaffold — E702 (semicolons used for compact candle construction),
# E741 (single-letter 'l' is the OHLC "low" field, a domain convention),
# F841 (bot.py has a 'pip' variable computed but not yet wired in the scaffold).
"src/forex_scalper/backtest.py" = ["E702", "E741"]
"src/forex_scalper/bot.py" = ["E702", "E741", "F841"]
"src/forex_scalper/demo_smoke.py" = ["E702", "E741"]
# Test helper uses o/h/l/c parameter names matching the OHLC domain convention.
"tests/test_indicators.py" = ["E741"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
# Vendored trading scaffold — preserved verbatim and pinned by characterization
# tests. We don't retrofit strict annotations onto the proven strategy logic.
module = [
    "forex_scalper.models", "forex_scalper.indicators", "forex_scalper.data",
    "forex_scalper.bias", "forex_scalper.regime", "forex_scalper.setups",
    "forex_scalper.session", "forex_scalper.trade_manager", "forex_scalper.journal",
    "forex_scalper.notifier", "forex_scalper.config", "forex_scalper.bot",
    "forex_scalper.backtest", "forex_scalper.demo_smoke",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# fetch_history CLI sections use dynamic oandapyV20 dicts (Any) and lazy imports
# for the v20 client (untyped third-party lib). Relax only what the dynamic
# nature of the OANDA SDK requires; the testable core remains strictly typed.
module = ["scripts.fetch_history"]
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false
