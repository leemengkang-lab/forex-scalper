[project]
name = "forex-scalper"
version = "0.1.0"
description = "Multi-timeframe / multi-pair scalping bot (OANDA v20)"
requires-python = ">=3.13"
dependencies = [
    "oandapyV20>=0.7.2",
    "requests>=2.31",
    "six>=1.16",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-telegram-bot[ext]>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_scalper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "demo: tests that hit the real OANDA demo account (require credentials)",
]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
